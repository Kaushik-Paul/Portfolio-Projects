<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="../resources/rocket-blue.svg">
    <title>Redirecting to Price is Right</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="redirect-style.css">
</head>

<body class="price-is-right">
    <div class="redirect-shell">
        <div class="redirect-topbar">
            <a href="../index.html#projects" class="back-link"><i class="fas fa-arrow-left"></i> Back to projects</a>
            <div class="theme-switcher" role="group" aria-label="Theme selector">
                <button type="button" class="theme-toggle" data-theme-option="light" aria-label="Use light theme" title="Light theme">
                    <i class="fas fa-sun"></i>
                </button>
                <button type="button" class="theme-toggle" data-theme-option="dark" aria-label="Use dark theme" title="Dark theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button type="button" class="theme-toggle" data-theme-option="system" aria-label="Use system theme" title="System theme">
                    <i class="fas fa-desktop"></i>
                </button>
            </div>
        </div>

        <div class="container">
            <span class="redirect-badge">Launching live project</span>
            <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
            <h1>Price is Right</h1>
            <p>This assistant helps you create, refine, and review contract language or deal proposals with an easy-to-use web interface.</p>

            <div class="loader">
                <div class="loader-bar"></div>
            </div>

            <img src="../resources/price-is-right.svg" alt="Price is Right" class="project-svg">

            <div class="redirect-actions">
                <a class="redirect-button primary" href="https://huggingface.co/spaces/kaushikpaul/Price-Is-Right">Open now</a>
                <a class="redirect-button secondary" href="../index.html#projects">Back to projects</a>
            </div>

            <p class="redirect-info">You will be redirected automatically in a few seconds. If not, <a href="https://huggingface.co/spaces/kaushikpaul/Price-Is-Right">click here</a>.</p>
        </div>
    </div>

    <script src="redirect-page.js"></script>
</body>

</html>
